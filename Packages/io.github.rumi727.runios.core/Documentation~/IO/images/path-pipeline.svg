<text x="36.0" y="380.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PhysicalPath.NormalizePath</text>
<text x="36.0" y="398.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Path.GetFullPath: &#x27;..&#x27; 해석</text>
<text x="36.0" y="413.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Windows: &#x27;\&#x27;도 구분자, 전부 소문자</text>
