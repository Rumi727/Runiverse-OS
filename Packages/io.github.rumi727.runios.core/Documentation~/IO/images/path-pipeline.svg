<rect x="665.0" y="276.0" width="315.0" height="64.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="1"/>
<text x="677.0" y="312.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>C:\Game\SA\assets\runios\..\lang\ko.json</text>
<line x1="167.0" y1="341.0" x2="167.0" y2="357.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#agray)"/>
