rient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="533" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="34.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">경로가 디스크에 닿기까지</text>
<text x="24.0" y="54.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">같은 입력이 RuniPath에서 PhysicalPath로 바뀌는 단계 (공급자 루트: Linux /game/sa, Windows C:\Game\SA)</text>
<text x="24.0" y="94.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">단계</text>
<text x="330.0" y="94.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Linux · Android</text>
<text x="665.0" y="94.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold">Windows 에디터 · 스탠드얼론</text>
<rect x="24.0" y="112.0" width="286.0" height="64.0" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="36.0" y="134.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">입력 문자열</text>
<text x="36.0" y="152.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">호출자가 넘긴 문자열</text>
