<text x="677.0" y="394.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>c:\game\sa\assets\lang\ko.json</text>
<line x1="167.0" y1="423.0" x2="167.0" y2="439.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#agray)"/>
<rect x="24.0" y="440.0" width="286.0" height="64.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1" opacity="1"/>
<text x="36.0" y="462.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">샌드박스 (4장)</text>
<text x="36.0" y="480.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">루트 밖이면 예외</text>
<text x="36.0" y="495.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">링크 경유는 정책에 따라</text>
<rect x="330.0" y="440.0" width="315.0" height="64.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="1"/>
<text x="342.0" y="476.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">루트 안 → System.IO로</text>
<rect x="665.0" y="440.0" width="315.0" height="64.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="1"/>
<text x="677.0" y="476.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">루트 안 → System.IO로</text>
