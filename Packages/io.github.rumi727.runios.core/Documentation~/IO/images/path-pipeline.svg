<text x="342.0" y="148.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>/assets//runios/../lang\ko.json</text>
<rect x="665.0" y="112.0" width="315.0" height="64.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" opacity="1"/>
<text x="677.0" y="148.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>/assets//runios/../lang\ko.json</text>
<line x1="167.0" y1="177.0" x2="167.0" y2="193.0" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#agray)"/>
<rect x="24.0" y="194.0" width="286.0" height="64.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="36.0" y="216.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>RuniPath.NormalizePath</text>
<text x="36.0" y="234.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">앞뒤 &#x27;/&#x27; 제거, &#x27;//&#x27; 합침</text>
<text x="36.0" y="249.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">&#x27;..&#x27; · &#x27;\&#x27; · 대소문자는 그대로</text>
