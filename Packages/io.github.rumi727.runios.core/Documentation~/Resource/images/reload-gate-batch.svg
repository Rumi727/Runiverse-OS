<line x1="200.0" y1="358.0" x2="200.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="276.0" y1="358.0" x2="276.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="352.0" y1="358.0" x2="352.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="428.0" y1="358.0" x2="428.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="504.0" y1="358.0" x2="504.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="580.0" y1="358.0" x2="580.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="656.0" y1="358.0" x2="656.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="732.0" y1="358.0" x2="732.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="808.0" y1="358.0" x2="808.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="884.0" y1="358.0" x2="884.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<line x1="960.0" y1="358.0" x2="960.0" y2="366.0" stroke="#9ca3af" stroke-width="1"/>
<text x="960.0" y="384.0" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">시간</text>
<text x="24.0" y="116.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">게이트 패스</text>
<rect x="201.0" y="92.0" width="302.0" height="40.0" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="352.0" y="109.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">패스 1: reload A</text>
<text x="352.0" y="125.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">진행률 → progressA</text>
<rect x="505.0" y="92.0" width="226.0" height="40.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1" opacity="1"/>
<text x="618.0" y="109.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">패스 2: reload C</text>
<text x="618.0" y="125.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">진행률 → progressB, progressC</text>
<rect x="733.0" y="92.0" width="150.0" height="40.0" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" opacity="1"/>
<text x="808.0" y="109.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">패스 3: reload D</text>
<text x="808.0" y="125.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">진행률 → progressD</text>
<line x1="200.0" y1="148.0" x2="884.0" y2="148.0" stroke="#ea580c" stroke-width="2"/>
<line x1="200.0" y1="143.0" x2="200.0" y2="153.0" stroke="#ea580c" stroke-width="2"/>
<line x1="884.0" y1="143.0" x2="884.0" y2="153.0" stroke="#ea580c" stroke-width="2"/>
<text x="542.0" y="164.0" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold">배치 (isRunning == true)</text>
<text x="24.0" y="200.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>Run(A, progressA)</text>
<circle cx="200.0" cy="196.0" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<line x1="206.0" y1="196.0" x2="878.0" y2="196.0" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M884.0,190 L890.0,196 L884.0,202 L878.0,196 z" fill="#ea580c" stroke="#fff" stroke-width="1.2"/>
<text x="212.0" y="188.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">실행</text>
<text x="24.0" y="244.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>Run(B, progressB)</text>
<circle cx="276.0" cy="240.0" r="5" fill="#9ca3af" stroke="#ffffff" stroke-width="1.5"/>
<line x1="282.0" y1="240.0" x2="878.0" y2="240.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M884.0,234 L890.0,240 L884.0,246 L878.0,240 z" fill="#ea580c" stroke="#fff" stroke-width="1.2"/>
<text x="288.0" y="232.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">B 델리게이트 폐기, progressB는 패스 2로</text>
<text x="24.0" y="288.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>Run(C, progressC)</text>
<circle cx="352.0" cy="284.0" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<line x1="358.0" y1="284.0" x2="878.0" y2="284.0" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M884.0,278 L890.0,284 L884.0,290 L878.0,284 z" fill="#ea580c" stroke="#fff" stroke-width="1.2"/>
<text x="364.0" y="276.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">대기 요청 = C</text>
<text x="24.0" y="332.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>Run(D, progressD)</text>
<circle cx="580.0" cy="328.0" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<line x1="586.0" y1="328.0" x2="878.0" y2="328.0" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M884.0,322 L890.0,328 L884.0,334 L878.0,328 z" fill="#ea580c" stroke="#fff" stroke-width="1.2"/>
<text x="592.0" y="320.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">패스 2 중 → 대기 요청 = D</text>
<text x="894.0" y="266.0" font-size="11" fill="#ea580c" text-anchor="start" font-weight="normal">모두 같은 Task</text>
<text x="894.0" y="281.0" font-size="11" fill="#ea580c" text-anchor="start" font-weight="normal">배치 끝에 완료</text>
</svg>
