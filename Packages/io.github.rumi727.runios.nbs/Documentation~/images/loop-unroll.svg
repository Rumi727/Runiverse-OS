<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif' font-size="13">
<title>반복 구간 펼치기</title>
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="agrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="alblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dbeafe"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="alorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffedd5"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="algreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcfce7"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="alpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ede9fe"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="399" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">NBSTimeline.Query: 반복 구간을 &#x27;거리&#x27; 축 위에 펼쳐서 조회 (tempo &gt; 0)</text>
<text x="24.0" y="84.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">곡 타임라인</text>
<line x1="60.0" y1="110.0" x2="940.0" y2="110.0" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="260.0" y="96.0" width="440.0" height="28.0" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1" opacity="1"/>
<text x="260.0" y="142.0" font-size="11.5" fill="#ca8a04" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>loop.start</text>
<text x="700.0" y="142.0" font-size="11.5" fill="#ca8a04" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>loop.end</text>
<text x="160.0" y="132.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">intro (첫 패스만)</text>
<line x1="560.0" y1="86.0" x2="560.0" y2="134.0" stroke="#dc2626" stroke-width="2.4"/>
<text x="560.0" y="80.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>position</text>
<text x="24.0" y="204.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">거리(distance) 축 = 지금부터 타임라인을 얼마나 진행했는가</text>
<rect x="60.0" y="236.0" width="119.0" height="28.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1" opacity="1"/>
<text x="119.5" y="255.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>segment 0</text>
<text x="60.0" y="298.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>offset 0</text>
<rect x="182.0" y="236.0" width="374.0" height="28.0" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1" opacity="1"/>
<text x="369.0" y="255.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>segment 1</text>
<text x="182.0" y="298.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>offset Σ</text>
<rect x="559.0" y="236.0" width="374.0" height="28.0" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1" opacity="1"/>
<text x="746.0" y="255.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>segment 2</text>
<text x="559.0" y="298.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>offset Σ</text>
<rect x="100.0" y="220.0" width="520.0" height="60.0" rx="4" fill="none" stroke="#2563eb" stroke-width="2" opacity="1" stroke-dasharray="6,4"/>
<text x="100.0" y="214.0" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>from</text>
<text x="620.0" y="214.0" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>to = lookahead · |tempo|</text>
<text x="24.0" y="320.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• segment 0: position → loop.end. 이후 segment: loop.start → loop.end 를 offset만큼 밀어서 반복. offset이 to를 넘을 때까지 계속합니다.</text>
<text x="24.0" y="338.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 각 노트의 distance = offset + (entry − segmentStart). 창 (from, to] 안이면 NBSPlannedVoice로 출력합니다.</text>
<text x="24.0" y="356.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• Domain: 첫 정방향 패스는 intro(loop.start 이전)도 포함, 이후 패스는 [loop.start, loop.end)만. 늦은 시작(음수 거리)은 첫 segment에서만 찾습니다.</text>
<text x="24.0" y="374.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• position이 이미 loop.end 이상이면(반복 밖) 반복 없이 끝까지 한 segment로 조회합니다. tempo &lt; 0이면 방향과 경계가 반대입니다.</text>
</svg>
