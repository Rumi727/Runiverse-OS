<text x="24.0" y="480.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 창 = (cursorClock, snapshot.clock + lookahead·|tempo|] (거리 단위). 각 노트는 정확히 한 순회에서 한 번만 잡히고, 예약된 시작 클록은 앵커에서 계산되므로 순회 시각에 흔들리지 않습니다.</text>
<text x="24.0" y="498.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 순회가 늦어져도 cursor 덕분에 빠지는 노트가 없고, 이미 지난 시작은 늦은 만큼 소리 앞부분을 건너뛰어 재생합니다.</text>
