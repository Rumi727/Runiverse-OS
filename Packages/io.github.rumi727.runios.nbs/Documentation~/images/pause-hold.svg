<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif' font-size="13">
<title>Pause와 heldEndDistance</title>
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="agrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="alblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dbeafe"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="alorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffedd5"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="algreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcfce7"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="alpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ede9fe"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="329" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">Pause 중 Stopper 정지점 보존 (heldEndDistance)</text>
<text x="24.0" y="80.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">DSP 클록 (일시 정지 중에도 계속 흐름)</text>
<line x1="60.0" y1="110.0" x2="940.0" y2="110.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#aink)"/>
<rect x="148.0" y="98.0" width="264.0" height="24.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="148.0" y="140.0" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>startClock</text>
<rect x="412.0" y="98.0" width="220.0" height="24.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1" stroke-dasharray="4,3"/>
<text x="522.0" y="115.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">Pause 구간</text>
<line x1="500.0" y1="86.0" x2="500.0" y2="134.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
<text x="500.0" y="80.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>원래 endClock</text>
<line x1="412.0" y1="92.0" x2="500.0" y2="92.0" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aorange)" marker-start="url(#aorange)"/>
<text x="456.0" y="160.0" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>heldEndDistance = (endClock − pauseClock)/rate · |tempo|</text>
<rect x="632.0" y="98.0" width="88.0" height="24.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="1"/>
<line x1="720.0" y1="86.0" x2="720.0" y2="134.0" stroke="#16a34a" stroke-width="2"/>
<text x="720.0" y="80.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>새 endClock</text>
<line x1="632.0" y1="92.0" x2="720.0" y2="92.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agreen)" marker-start="url(#agreen)"/>
<text x="676.0" y="182.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>UnPause: endClock = unpauseClock + heldEndDistance/|tempo|·rate</text>
<text x="24.0" y="240.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• FMOD 채널을 Pause해도 DSP 클록은 계속 흐르므로, setDelay의 end 클록을 그대로 두면 일시 정지 중에 소리가 멈춰 버립니다.</text>
<text x="24.0" y="258.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 그래서 Pause에서는 남은 &#x27;타임라인 거리&#x27;로 바꿔 보관하고(endClock = 0, SetDelay(startClock)로 정지점 해제),</text>
<text x="24.0" y="276.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">  UnPause에서 재개 클록 기준으로 다시 클록으로 바꿔 SetDelay(startClock, endClock) 합니다. tempo 변경(RetimeStopPoint)도 같은 &#x27;거리 보존&#x27; 원리입니다.</text>
<text x="24.0" y="300.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 아직 시작하지 않은 Voice(startClock &gt; 현재)는 Pause에서 그냥 Stop하고, UnPause 후 워커가 cursor부터 다시 예약합니다.</text>
</svg>
