<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif' font-size="13">
<title>NBSTempoMap</title>
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="agrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="alblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dbeafe"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="alorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffedd5"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="algreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcfce7"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="alpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ede9fe"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="439" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">NBSTempoMap: tick ↔ 초 구간 선형 변환</text>
<text x="24.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>TickToTime(tick) = c.time + (tick − c.tick) / c.ticksPerSecond,  c = FindByTick(tick) (이진 탐색: c.tick ≤ tick 인 마지막 변경)</text>
<line x1="80.0" y1="360.0" x2="900.0" y2="360.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#aink)"/>
<line x1="80.0" y1="360.0" x2="80.0" y2="90.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#aink)"/>
<text x="896.0" y="382.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">tick</text>
<text x="86.0" y="94.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">time (초)</text>
<polyline points="80.0,360.0 314.3,288.0 548.6,252.0 665.7,180.0 900.0,108.0" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="80.0" cy="360.0" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="80.0" y1="360.0" x2="80.0" y2="360.0" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="86.0" y="350.0" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>(0, 10 TPS, 0.00s)</text>
<circle cx="314.3" cy="288.0" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="314.3" y1="360.0" x2="314.3" y2="288.0" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="320.3" y="278.0" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>(40, 20 TPS, 4.00s)</text>
<circle cx="548.6" cy="252.0" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="548.6" y1="360.0" x2="548.6" y2="252.0" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="554.6" y="242.0" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>(80, 5 TPS, 6.00s)</text>
<circle cx="665.7" cy="180.0" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="665.7" y1="360.0" x2="665.7" y2="180.0" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
<text x="671.7" y="170.0" font-size="11.5" fill="#ea580c" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>(100, 10 TPS, 10.00s)</text>
<text x="24.0" y="408.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 각 변경점의 time은 생성자에서 한 번 누적 계산됩니다. 같은 tick의 변경은 마지막 값이 이깁니다. Tempo Changer: tps = max(0.25, |(int)pitch| / 15), BPM = TPS × 15.</text>
<text x="24.0" y="426.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• TimeToTick은 같은 선분을 거꾸로: c.tick + (time − c.time) · c.ticksPerSecond (FindByTime).</text>
</svg>
