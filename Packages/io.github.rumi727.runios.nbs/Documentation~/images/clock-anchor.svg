<rect x="0.5" y="0.5" width="979" height="519" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">NoteBlockSource의 타임라인 = DSP 클록 위의 직선 (NBSClockAnchor)</text>
<text x="24.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>linear(clock) = clock ≤ anchor.dspClock ? anchor.time : anchor.time + (clock − anchor.dspClock) / sampleRate · tempo</text>
