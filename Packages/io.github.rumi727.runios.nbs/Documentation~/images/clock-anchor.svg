<text x="24.0" y="470.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 명령은 언제 오든 &#x27;다음 믹스 클록&#x27;(TryGetNextMixClock)에서 효과가 납니다. 그래서 보통 한두 블록 늦게 반영되지만, 소리의 시작 클록은 전부 이 직선에서 계산되므로</text>
<text x="24.0" y="488.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">  워커가 언제 돌든 소리 사이 간격은 샘플 단위로 정확합니다. 클록을 못 읽으면 앵커 dspClock = ulong.MaxValue → 영원히 &#x27;앵커 전&#x27;(유지) 상태가 됩니다.</text>
