<text x="203.3" y="378.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">stamp.timestamp (블록마다)</text>
<text x="637.6" y="151.6" font-size="12" fill="#2563eb" text-anchor="end" font-weight="bold">time ← GetTime(stamp.dspClock) @ stamp.timestamp</text>
<text x="181.8" y="351.9" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">outputTime ← anchor.time + (stamp.outputClock − anchor.dspClock)/rate · tempo</text>
<line x1="844.0" y1="122.4" x2="844.0" y2="160.2" stroke="#ea580c" stroke-width="1.6" marker-end="url(#aorange)" marker-start="url(#aorange)"/>
<text x="852.0" y="145.3" font-size="12" fill="#ea580c" text-anchor="start" font-weight="normal">출력 지연 × tempo</text>
<text x="24.0" y="396.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• time은 &#x27;믹서가 이미 계산한 위치&#x27;, outputTime은 &#x27;스피커에서 지금 나는 위치&#x27;입니다. 둘 다 SoundSystem.onUpdate(약 10 ms 주기)에서 새 스탬프가 있을 때만 다시 기준점을 잡고,</text>
<text x="24.0" y="414.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">  그 사이에는 RuniAudioSource의 보간으로 매끄럽게 움직입니다. 앵커가 아직 미래이면 GetMixTimestamp가 기준 타임스탬프를 미래로 외삽해 위치를 유지시킵니다.</text>
