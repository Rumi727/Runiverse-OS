<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif' font-size="13">
<title>FMOD 믹스 블록과 클록</title>
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="agrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="alblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dbeafe"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="alorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffedd5"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="algreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcfce7"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="alpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ede9fe"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="439" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">FMOD 믹서의 블록 띠: 한 칸 = DSP 버퍼 길이(bufferLength 샘플)</text>
<text x="24.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">예: 1024 샘플 @ 48 kHz ≈ 21.3 ms, bufferCount = 4 → 출력 지연 ≈ 85 ms</text>
<rect x="40.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="84.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k−5</text>
<rect x="132.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="176.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k−4</text>
<rect x="224.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1" opacity="1"/>
<text x="268.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k−3</text>
<rect x="316.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1" opacity="1"/>
<text x="360.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k−2</text>
<rect x="408.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1" opacity="1"/>
<text x="452.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k−1</text>
<rect x="500.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1" opacity="1"/>
<text x="544.0" y="160.0" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>믹스 중 k</text>
<rect x="592.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="636.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k+1</text>
<rect x="684.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="728.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k+2</text>
<rect x="776.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="820.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k+3</text>
<rect x="868.0" y="130.0" width="88.0" height="48.0" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" opacity="1"/>
<text x="912.0" y="160.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>블록 k+4</text>
<text x="224.0" y="116.0" font-size="12" fill="#16a34a" text-anchor="start" font-weight="normal">링 버퍼 bufferCount개 = 출력 대기 + 믹스 중</text>
<line x1="224.0" y1="122.0" x2="588.0" y2="122.0" stroke="#16a34a" stroke-width="1.5"/>
<text x="596.0" y="116.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">아직 손대지 않은 미래</text>
<line x1="222.0" y1="126.0" x2="222.0" y2="200.0" stroke="#16a34a" stroke-width="2"/>
<circle cx="222.0" cy="200.0" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
<text x="222.0" y="222.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>outputClock</text>
<text x="222.0" y="240.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">장치가 지금 내보내는 샘플</text>
<line x1="498.0" y1="126.0" x2="498.0" y2="260.0" stroke="#7c3aed" stroke-width="2"/>
<circle cx="498.0" cy="260.0" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
<text x="498.0" y="282.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>GetMasterDSPClock()</text>
<text x="498.0" y="300.0" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">믹스 중 블록의 시작 또는 다음 블록의 시작</text>
<line x1="590.0" y1="126.0" x2="590.0" y2="200.0" stroke="#2563eb" stroke-width="2"/>
<circle cx="590.0" cy="200.0" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="598.0" y="222.0" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>stamp.dspClock</text>
<text x="598.0" y="240.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">shouldiprocess: getclock + length = 믹스 중 블록의 끝</text>
<line x1="590.0" y1="126.0" x2="590.0" y2="320.0" stroke="#dc2626" stroke-width="2"/>
<circle cx="590.0" cy="320.0" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="598.0" y="342.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="bold" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>TryGetNextMixClock</text>
<text x="598.0" y="360.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">master clock + 1블록 (마스터가 k+1을 가리켰다면 k+2)</text>
<line x1="222.0" y1="190.0" x2="590.0" y2="190.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agreen)" marker-start="url(#agreen)"/>
<text x="408.0" y="208.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="normal">outputLatency = bufferLength · bufferCount</text>
<text x="24.0" y="424.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">• 마스터 클록 값이 &#x27;믹스 중 블록의 시작&#x27;일 수도 &#x27;다음 블록의 시작&#x27;일 수도 있으므로 한 블록을 더해야 확실히 아직 믹스하지 않은 블록이 됩니다.</text>
</svg>
