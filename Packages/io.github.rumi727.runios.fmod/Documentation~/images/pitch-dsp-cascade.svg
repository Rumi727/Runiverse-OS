<text x="350.0" y="240.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PitchShiftDSP</text>
<text x="350.0" y="257.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 0.5</text>
<line x1="424.0" y1="243.0" x2="456.0" y2="243.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
<rect x="460.0" y="220.0" width="140.0" height="46.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" opacity="1"/>
