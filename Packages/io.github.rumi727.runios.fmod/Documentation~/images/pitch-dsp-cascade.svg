<text x="530.0" y="257.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 0.5</text>
<line x1="604.0" y1="243.0" x2="636.0" y2="243.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
