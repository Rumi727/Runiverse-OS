<text x="710.0" y="240.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PitchShiftDSP</text>
<text x="710.0" y="257.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 0.6</text>
<line x1="784.0" y1="243.0" x2="816.0" y2="243.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
