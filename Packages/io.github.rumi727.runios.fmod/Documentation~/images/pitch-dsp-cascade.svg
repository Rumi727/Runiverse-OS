rient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="309" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">피치 DSP 단계 분해</text>
<text x="24.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">채널 주파수가 tempo를 맡고, PitchShiftDSP(0.5~2배)들이 음높이 비율 pitch / |tempo|를 나눠 맡습니다.</text>
<text x="40.0" y="83.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">pitch 1, tempo 0.2  →  비율 5</text>
<rect x="40.0" y="95.0" width="200.0" height="46.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="1"/>
<text x="140.0" y="115.0" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>SoundChannel</text>
<text x="140.0" y="132.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>frequency = clip × 0.2</text>
<line x1="244.0" y1="118.0" x2="276.0" y2="118.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
<rect x="280.0" y="95.0" width="140.0" height="46.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" opacity="1"/>
<text x="350.0" y="115.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PitchShiftDSP</text>
<text x="350.0" y="132.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 2</text>
<line x1="424.0" y1="118.0" x2="456.0" y2="118.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
<rect x="460.0" y="95.0" width="140.0" height="46.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" opacity="1"/>
<text x="530.0" y="115.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PitchShiftDSP</text>
<text x="530.0" y="132.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 2</text>
<line x1="604.0" y1="118.0" x2="636.0" y2="118.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
<rect x="640.0" y="95.0" width="140.0" height="46.0" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1" opacity="1"/>
<text x="710.0" y="115.0" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>PitchShiftDSP</text>
<text x="710.0" y="132.0" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>pitch = 1.25</text>
<line x1="784.0" y1="118.0" x2="816.0" y2="118.0" stroke="#1f2937" stroke-width="1.5" marker-end="url(#aink)"/>
<text x="822.0" y="123.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="normal">출력</text>
<text x="40.0" y="163.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">단계 3개, 곱 = 2 × 2 × 1.25 = 5   ·   pitchDSPTimeOffset = 3 × 4096 / clip.frequency 초</text>
<text x="40.0" y="208.0" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold">pitch 0.6, tempo 4  →  비율 0.15</text>
