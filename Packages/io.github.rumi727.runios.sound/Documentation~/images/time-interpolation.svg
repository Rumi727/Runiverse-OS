<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif' font-size="13">
<title>RuniAudioSource 시간 보간</title>
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="asub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="agrid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="alblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dbeafe"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="alorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffedd5"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="algreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dcfce7"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="alpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ede9fe"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="alred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fee2e2"/></marker><marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="algray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3f4f6"/></marker><marker id="ayellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker><marker id="alyellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef9c3"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="489" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24.0" y="32.0" font-size="16" fill="#1f2937" text-anchor="start" font-weight="bold">RuniAudioSource.time: 기준점(baseTime, baseTimestamp)에서 벽시계로 외삽</text>
<text x="24.0" y="52.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>time = baseTime + max(0, now − baseTimestamp) / Stopwatch.Frequency · tempo</text>
<line x1="70.0" y1="420.0" x2="930.0" y2="420.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#aink)"/>
<line x1="70.0" y1="420.0" x2="70.0" y2="90.0" stroke="#1f2937" stroke-width="1.2" marker-end="url(#aink)"/>
<text x="926.0" y="442.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">벽시계 (Stopwatch.GetTimestamp)</text>
<text x="60.0" y="84.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">time</text>
<polyline points="113.0,387.0 328.0,304.5" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="328.0,311.1 543.0,228.6" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="328.0" y1="304.5" x2="328.0" y2="311.1" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
<polyline points="543.0,228.6 629.0,228.6" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/>
<polyline points="629.0,228.6 869.8,136.2" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="113.0" cy="387.0" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="328.0" cy="311.1" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="629.0" cy="228.6" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<text x="121.0" y="405.0" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal">Sync(1.0, t₀): 기준점</text>
<text x="336.0" y="331.1" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal">다음 동기화: 실제 값으로 다시 기준점 설정</text>
<text x="336.0" y="347.1" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="normal">(점프 = 보간 오차 교정)</text>
<text x="620.4" y="214.6" font-size="12" fill="#ea580c" text-anchor="end" font-weight="bold">baseTimestamp가 미래 → 그때까지 유지(clamp 0)</text>
<line x1="629.0" y1="420.0" x2="629.0" y2="228.6" stroke="#ea580c" stroke-width="1" stroke-dasharray="4,3"/>
<text x="629.0" y="438.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="normal" font-family='"JetBrains Mono","Cascadia Code",Consolas,monospace'>baseTimestamp</text>
<text x="749.4" y="202.2" font-size="12" fill="#2563eb" text-anchor="start" font-weight="normal">기울기 = tempo</text>
<text x="24.0" y="474.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">일시 정지·정지 중에는 now와 무관하게 baseTime을 그대로 반환합니다. outputTime도 같은 방식의 두 번째 기준점(outputBaseTime, outputBaseTimestamp)을 씁니다.</text>
</svg>
